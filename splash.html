<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            position: relative;
            width: 320px;
            height: 340px;
            background: rgba(32, 32, 48, 0.97);
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        /* Subtle animated glow behind the card */
        .container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(59, 130, 246, 0.15),
                transparent,
                rgba(139, 92, 246, 0.15),
                transparent
            );
            animation: borderRotate 4s linear infinite;
            z-index: -1;
        }

        .container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 48px;
            background: rgba(32, 32, 48, 0.97);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Logo */
        .logo-wrap {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 24px;
        }

        .logo-glow {
            position: absolute;
            inset: -24px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: breathe 3s ease-in-out infinite;
        }

        .logo-img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: logoSpin 8s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.3));
        }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 0.3s forwards;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 0.5s forwards;
        }

        /* Loader - 3 dots */
        .loader-dots {
            display: flex;
            gap: 6px;
            margin-top: 32px;
            opacity: 0;
            animation: fadeIn 0.4s ease-out 0.8s forwards;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.6);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        /* Animations */
        @keyframes borderRotate {
            to { transform: rotate(360deg); }
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes logoSpin {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Light Mode Adaptations */
        @media (prefers-color-scheme: light) {
            .container {
                background: rgba(250, 250, 250, 0.97);
                border: 1px solid rgba(0, 0, 0, 0.08);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            }
            .container::after {
                background: rgba(250, 250, 250, 0.97);
            }
            .subtitle {
                color: rgba(0, 0, 0, 0.45);
            }
            .logo-glow {
                background: radial-gradient(circle, rgba(96, 165, 250, 0.15) 0%, transparent 70%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo-wrap">
                <div class="logo-glow"></div>
                <img class="logo-img" src="dist/icon.png" alt="Explore" onerror="this.src='public/icon.png'" />
            </div>
            <span class="title">Explore</span>
            <span class="subtitle">Browser</span>
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
</body>
</html>
